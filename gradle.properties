# Gradle memory and parallelism.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# IntelliJ + Loom currently incompatible with Gradle's configuration cache:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Toolchain versions — cross-check at https://fabricmc.net/develop before bumping.
minecraft_version=26.3
loader_version=0.20.1
# Pinned to a release rather than a moving SNAPSHOT so a Loom publish can't
# change the build under us between two runs of the same commit.
loom_version=1.17.17
fabric_api_version=0.165.0+26.3

# Mod dependencies.
cloth_config_version=26.3.159
modmenu_version=21.0.0

# Test-only dependency versions.
junit_version=5.14.4

# Mod identity.
mod_version=0.2.0
maven_group=io.dnbg.minecraft
