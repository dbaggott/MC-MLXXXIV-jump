# Gradle memory and parallelism.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# IntelliJ + Loom currently incompatible with Gradle's configuration cache:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Toolchain versions: what the default build compiles, tests and runs the dev client on.
# Cross-check at https://fabricmc.net/develop before bumping. Bumping these never moves the
# declared minimums below.
minecraft_version=26.3
loader_version=0.20.1
# Pinned to a release rather than a moving SNAPSHOT so a Loom publish can't
# change the build under us between two runs of the same commit.
loom_version=1.17.17
fabric_api_version=0.165.0+26.3

# Mod dependencies.
cloth_config_version=26.3.159
modmenu_version=21.0.0

# Declared minimums: fabric.mod.json's dependency ranges. Each is the oldest version the mod
# actually needs, not the one it is built with, so players on older installs aren't turned away
# for nothing. `./gradlew build -Pfloors` (CI's floors job) builds and tests against exactly
# these, and fails if loader_floor isn't the highest loader any of them requires.
#
# The highest fabricloader the floors below declare (Fabric API's); the mod's own loader
# calls are older.
loader_floor=0.19.3
# The first builds for release 26.3.
fabric_api_floor=0.160.5+26.3
cloth_config_floor=26.3.158
modmenu_floor=21.0.0-beta.1

# Test-only dependency versions.
junit_version=5.14.4

# Mod identity.
mod_version=0.2.1
maven_group=io.dnbg.minecraft
