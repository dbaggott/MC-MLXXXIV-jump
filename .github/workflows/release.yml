name: release

# Merging a mod_version bump to main publishes GitHub Release v<mod_version>, with the jar and
# changelogs/<mod_version>.md as its body. "Run workflow" from the Actions tab, on main, retries a
# release that failed; on a version already released it stops at the gate.
#
# One workflow rather than an auto-tag workflow plus a release-on-tag one: a tag pushed with the
# default GITHUB_TOKEN does not trigger other workflows, so the second would never run.
on:
  push:
    branches: [main]
    paths: ['gradle.properties', 'changelogs/**']
  workflow_dispatch:

# Overlapping runs (a dispatch and a merge, or two quick merges) run one after the other, and the
# gate turns the later one into a no-op. GitHub keeps one pending run per group, so a third run
# queued behind a pending one replaces it; a version bumped and bumped again while a release is
# still running is skipped. Accepted: a dispatch can only release the current mod_version anyway.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        name: Decide whether to publish
        env:
          # A contents: read token cannot see draft releases, so a draft left by a failed run
          # counts as not published and the retry goes ahead.
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "mod_version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A dispatch from a branch would otherwise release code that never merged.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Run on $REF, not refs/heads/main: releases are cut from main only."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if OUT=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            echo "Release v$VERSION already exists: nothing to publish."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a confirmed not-found proceeds; any other failure fails the job.
          if [ "$OUT" != "release not found" ]; then
            echo "::error::gh release view v$VERSION failed: $OUT"
            exit 1
          fi
          echo "No release v$VERSION yet: publishing."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

      - id: jar
        name: Locate the mod jar
        run: |
          set -euo pipefail
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          JAR="build/libs/mcmlxxxiv-jump-$VERSION+$MC.jar"
          test -f "$JAR" || { echo "::error::$JAR was not built"; exit 1; }
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.jar.outputs.path }}

      # The plugin always creates a new draft, uploads to it, then publishes it, so every failed
      # run leaves a draft for the tag behind.
      - name: Delete leftover drafts for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"v$VERSION\") | .id" |
          while read -r id; do
            echo "Deleting draft release $id for v$VERSION"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

      - name: Publish to GitHub Releases
        run: ./gradlew publishMods --stacktrace
        env:
          GITHUB_TOKEN: ${{ github.token }}
