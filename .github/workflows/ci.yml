name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Merging a mod_version bump releases it, with this file as the release notes, so a bump
      # without one is caught here rather than by a failed release on main.
      - name: Check the changelog for mod_version exists
        run: |
          set -euo pipefail
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          test -s "changelogs/$VERSION.md" || {
            echo "::error file=gradle.properties::changelogs/$VERSION.md is missing or empty: add release notes for mod_version=$VERSION (see changelogs/README.md)"
            exit 1
          }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: mcmlxxxiv-jump-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # The single context branch protection requires. Which jobs gate a merge is then this
  # file's business rather than a Terraform change — `needs:` is the list.
  #
  # ⚠️ `if: always()` is load-bearing: without it this job is SKIPPED when a dependency
  # fails, and a skipped check reports SUCCESS to branch protection.
  ci-required:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "needs.*.result = $RESULTS"
          for r in ${RESULTS//,/ }; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::dependency reported '$r'"; exit 1 ;;
            esac
          done
