plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Loom adds Mojang + Fabric repos automatically; mavenCentral() is for JUnit.
	mavenCentral()
	maven {
		name = 'Shedaniel (Cloth Config)'
		url = uri('https://maven.shedaniel.me/')
	}
	maven {
		name = 'TerraformersMC (Mod Menu)'
		url = uri('https://maven.terraformersmc.com/releases/')
	}
}

// No splitEnvironmentSourceSets(): the mod is client-only ("environment": "client" in
// fabric.mod.json), so there is no common code to keep apart and everything lives in src/main.

loom {
	// Where the dev client keeps its world, options and mods.
	//
	// Defaults to `run/` inside the project directory, which means a
	// worktree gets its own empty world and its own keybinds — fine for a throwaway test, useless
	// for playing the mod. Setting `jump_run_dir` to an absolute path in
	// ~/.gradle/gradle.properties points every worktree on that machine at one shared directory.
	//
	// A user-level property rather than a committed value on purpose: the path is per-machine, and
	// a clone that sets nothing still gets the ordinary `run/`.
	runs.configureEach {
		String shared = providers.gradleProperty("jump_run_dir").getOrNull()
		// Blank counts as unset: a property line left empty in gradle.properties should fall back
		// to the default rather than resolve the run directory to nothing.
		if (shared != null && !shared.isBlank()) {
			runDir = shared
		}
	}
}

// `-Pfloors` builds against fabric.mod.json's declared minimums (the `*_floor` properties) instead
// of the toolchain versions, so each minimum is a version CI has compiled and tested against.
def floors = providers.gradleProperty("floors").isPresent()
def versionOf = { String name -> project.property(floors ? "${name}_floor" : "${name}_version") }

dependencies {
	// Versions live in gradle.properties so they're easy to bump in one place.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Strictly, because Gradle otherwise resolves the highest loader any dependency's POM names,
	// which can put the floors build on a newer loader than it declares.
	implementation("net.fabricmc:fabric-loader") {
		version { strictly versionOf("loader") }
	}
	implementation "net.fabricmc.fabric-api:fabric-api:${versionOf("fabric_api")}"

	// Required: the config screen is built with it. Its own Fabric API pin is excluded so the one
	// above is the only Fabric API on the classpath.
	implementation("me.shedaniel.cloth:cloth-config-fabric:${versionOf("cloth_config")}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// Optional at runtime (`suggests` in fabric.mod.json): compiled against for the screen entry
	// point, and loaded in the dev client so the screen can be reached there.
	compileOnly "com.terraformersmc:modmenu:${versionOf("modmenu")}"
	localRuntime "com.terraformersmc:modmenu:${versionOf("modmenu")}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	// Gradle 9 no longer puts the JUnit Platform launcher on the test runtime implicitly.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	// fabric.mod.json's version and dependency ranges come from gradle.properties, so a port to a
	// new Minecraft line edits versions in one place. The ranges' minimums are the `*_floor`
	// properties, not the versions the jar is built with.
	def props = ["minecraft_version", "loader_floor", "fabric_api_floor", "cloth_config_floor", "modmenu_floor"]
		.collectEntries { [it, project.property(it)] } + [version: project.version]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

// In the floors build, loader_floor must be exactly the highest fabricloader that any mod on the
// runtime classpath declares: lower, and the jar claims a loader its dependencies refuse; higher,
// and it turns players away for nothing. If the mod's own code ever needs a newer loader than its
// dependencies do, that need belongs in this check.
def checkLoaderFloor = tasks.register("checkLoaderFloor") {
	def runtime = configurations.runtimeClasspath
	def declared = project.property("loader_floor").toString()
	inputs.files(runtime)
	doLast {
		def parse = { String v, String where ->
			if (!(v ==~ /\d+(\.\d+)*/)) {
				throw new GradleException("checkLoaderFloor can't compare loader version '${v}' (${where}); expected digits and dots.")
			}
			v.tokenize(".").collect { it as int }
		}
		def compare = { List<Integer> a, List<Integer> b ->
			for (int i = 0; i < Math.max(a.size(), b.size()); i++) {
				int d = (i < a.size() ? a[i] : 0) <=> (i < b.size() ? b[i] : 0)
				if (d != 0) return d
			}
			0
		}
		def needs = [:]
		runtime.files.findAll { it.name.endsWith(".jar") }.each { jar ->
			new java.util.zip.ZipFile(jar).withCloseable { zip ->
				def entry = zip.getEntry("fabric.mod.json")
				if (entry == null) return
				def meta = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
				def req = meta.depends?.fabricloader
				if (req == null || req == "*") return
				if (!(req instanceof String) || !req.startsWith(">=")) {
					throw new GradleException("checkLoaderFloor can't read ${jar.name}'s fabricloader requirement ${req}; expected \">=<version>\".")
				}
				needs[jar.name] = req.substring(2)
			}
		}
		def highest = needs.max { a, b -> compare(parse(a.value, a.key), parse(b.value, b.key)) }
		if (highest == null) {
			throw new GradleException("checkLoaderFloor found no fabricloader requirement on the runtime classpath.")
		}
		int c = compare(parse(declared, "loader_floor"), parse(highest.value, highest.key))
		if (c < 0) {
			throw new GradleException("loader_floor=${declared} is below ${highest.value}, which ${highest.key} requires. Raise loader_floor to ${highest.value}.")
		}
		if (c > 0) {
			throw new GradleException("loader_floor=${declared} is above what anything needs: the highest requirement is ${highest.value} (${highest.key}). Lower loader_floor to ${highest.value}.")
		}
	}
}
if (floors) {
	tasks.named("check") { dependsOn checkLoaderFloor }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// Minecraft's log4j config, on the test classpath, writes logs/latest.log under the working
	// directory; keep that out of the checkout.
	workingDir = layout.buildDirectory.dir("test-work").get().asFile
	doFirst { workingDir.mkdirs() }
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// Each jar is built for one Minecraft line (fabric.mod.json's `minecraft` dependency pins it),
	// so the file name says which. Only the file name: fabric.mod.json's `version` is `project.version`,
	// the plain mod_version.
	archiveVersion = "${project.mod_version}+${project.minecraft_version}"

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Releases go to GitHub Releases only. .github/workflows/release.yml runs `publishMods` once a
// mod_version bump reaches main; README.md's "Releasing" section is the procedure.
def changelogPath = "changelogs/${project.mod_version}.md"
def changelogFile = layout.projectDirectory.file(changelogPath)

publishMods {
	// With current Loom, `jar` produces the remapped jar; there is no `remapJar` task.
	file = tasks.jar.archiveFile
	// Read lazily, and thrown here rather than left to the plugin, whose own error for a missing
	// changelog doesn't name the file.
	changelog = provider {
		if (!changelogFile.asFile.exists()) {
			throw new GradleException(
				"Changelog file ${changelogPath} not found. Create it before releasing v${project.mod_version}."
			)
		}
		changelogFile.asFile.text
	}
	// Any other type publishes a pre-release, which /releases/latest skips.
	type = STABLE
	modLoaders.add("fabric")
	displayName = "MCMLXXXIV Jump ${project.mod_version}"

	github {
		repository = "dbaggott/MC-MLXXXIV-jump"
		tagName = "v${project.mod_version}"
		commitish = providers.environmentVariable("GITHUB_SHA").orElse("main")
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
	}
}
